<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Інтерполююча поверхня</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Інтерполююча поверхня та її проекції</h1>
    <div class="canvas-container">
        <div>
            <h2>Проекція на площину XY</h2>
            <canvas id="canvasXY" width="400" height="400"></canvas>
        </div>
        <div>
            <h2>Проекція на площину XZ</h2>
            <canvas id="canvasXZ" width="400" height="400"></canvas>
        </div>
        <div>
            <h2>Проекція на площину YZ</h2>
            <canvas id="canvasYZ" width="400" height="400"></canvas>
        </div>
    </div>
    <script src="./app.js"></script>
</body>
</html>
